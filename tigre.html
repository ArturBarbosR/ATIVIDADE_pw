<section class="game-page">

    <span>JOGO DEMONSTRATIVO</span>

    <h1>🐯 Little Tiger</h1>

    <p>
        Teste sua sorte usando somente pontos virtuais.
    </p>


    <div class="virtual-balance">

        Créditos virtuais:

        <strong id="pontos">1000</strong>

    <div class="slot-machine">

        <div class="slot">🐯</div>
        <div class="slot">⭐</div>
        <div class="slot">💎</div>

    </div>


    <button class="spin-button" onclick="girarTigre()">
        GIRAR
    </button>


    <p id="resultado" class="resultado">
        Clique em GIRAR para começar.
    </p>

<footer class="footer">

    <div class="footer-logo">🦁 LittleLion</div>

    <p>Jogo demonstrativo sem dinheiro real.</p>
